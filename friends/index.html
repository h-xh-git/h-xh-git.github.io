<a class="skip-link" href="#main">跳到页面内容</a>

<div class="site-shell page-shell">

  <!-- ================= 站头 ================= -->
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="夜坐所安的小屋 首页">
      <span>夜坐所安的小屋</span>
    </a>

    <nav aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="../projects/index.html">项目</a>
      <a href="../essays/index.html">随笔</a>
      <a href="../photos/index.html">相册</a>
      <a href="../collections/index.html">收集</a>
      <a href="index.html" class="active" aria-current="page">友链</a>
    </nav>

    <div class="header-contact">
      <span>
        <i></i>
        <span class="header-location-name" title="广州, CN">广州, CN</span>
      </span>
      <a class="button dark" href="mailto:huang_xiang_hua@163.com">
        聊聊
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8" />
        </svg>
      </a>
    </div>
  </header>

  <!-- ================= 主区 ================= |
       data-base："../" 用来把数据文件里写死的站内路径（头像）补成当前这一层能用的相对路径 -->
  <main id="main" tabindex="-1" class="page-main" data-friends data-base="../">

    <div class="page-head">
      <div>
        <span class="eyebrow">05 / Friends</span>
        <h1>友链</h1>
        <p>顺着链接，遇见一些有趣的人和他们的小小世界。</p>
      </div>
      <span class="page-number" aria-hidden="true">05</span>
    </div>

    <div class="page-summary">
      <span class="count" data-friend-count></span>
    </div>

    <!-- 卡片由 assets/js/friends-page.js 生成 -->
    <ul class="friend-list" data-friend-list></ul>

    <!-- 没朋友时露出来的占位（有内容时由 JS 藏起来） -->
    <div class="friend-empty" data-friend-empty hidden>
      <span class="friend-empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.6 13.4a4 4 0 0 0 5.66 0l2.83-2.83a4 4 0 0 0-5.66-5.66l-1.41 1.42" />
          <path d="M13.4 10.6a4 4 0 0 0-5.66 0l-2.83 2.83a4 4 0 0 0 5.66 5.66l1.41-1.42" />
        </svg>
      </span>
      <b>还没加朋友</b>
      <p>朋友的站还没写进来 —— 数据在 <b>assets/data/friends.js</b>，加一个对象这里就多一张卡。</p>
    </div>

  </main>

  <!-- ================= 页脚 ================= -->
  <footer class="site-footer">
    <span>© 2026 夜坐所安的小屋</span>
    <div>
      <a class="footer-contact" href="mailto:huang_xiang_hua@163.com" title="发邮件给我">huang_xiang_hua@163.com</a>
      <a class="footer-contact" href="https://github.com/h-xh-git" target="_blank" rel="noopener" aria-label="GitHub：h-xh-git" title="github.com/h-xh-git">GitHub · h-xh-git</a>
      <button type="button" data-pending="素材说明">素材说明</button>
      <span class="footer-motto">把好奇心变成作品。</span>
      <span class="footer-star">✳</span>
    </div>
  </footer>

</div>

<script src="../assets/data/friends.js"></script>
<script src="../assets/js/friends-page.js"></script>
<script src="../assets/music/playlist.js"></script>
<script src="../assets/js/player.js"></script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
